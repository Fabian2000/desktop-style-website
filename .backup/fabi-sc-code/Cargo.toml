[package]
name = "fabi-sc-code"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-timers = {version = "0.3.0", features = ["futures"] }
js-sys = "0.3.77"
lazy_static = "1.5.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
  "Window","Document","Element","Node","Event","EventTarget",
  "HtmlElement","HtmlInputElement","HtmlCanvasElement", "HtmlCollection","CanvasRenderingContext2d",
  "MouseEvent","KeyboardEvent","Performance","console", "DomTokenList",
  "IdbDatabase", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
  "IdbObjectStore", "IdbTransactionMode", "DomException"
] }

[build-dependencies]
chrono = "0.4.41"