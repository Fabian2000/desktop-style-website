<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fabian's Desktop</title>
        <link rel="icon" type="image/png" href="/resources/img/logo_inverted_bg.webp">
        <link rel="stylesheet" href="/resources/styles/main.css">
        <link rel="stylesheet" href="/resources/extern/fontawesome-free-7.0.0-web/css/all.min.css">
        <noscript>
            <style>
                .boot-animation {
                    display: none;
                }
            </style>
        </noscript>
    </head>
    <body>
        <div class="lock-screen">
            <div class="profile-section">
                <div class="profile-picture"></div>
            </div>
            <div class="welcome-msg">
                <p>Hello World</p>
            </div>
            <div class="login-section">
                <button class="login-btn" id="lock-screen-login" type="button" autofocus>Enter</button>
            </div>
        </div>
        <div class="boot-screen" oncontextmenu="return false">
            <div class="boot-identifier">
                <div class="boot-logo"></div>
            </div>
            <div class="boot-animation">
                <div class="boot-spinner"></div>
            </div>
            <noscript>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [ERR] Boot progress canceled.</p>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [INF] Unable to load scripts</p>
            </noscript>
        </div>
        <div class="offline-screen display-none" id="offline-screen">
            <div class="content">
                <div class="icon"></div>
                <h1>This site can’t be reached</h1>
                <p>The remote desktop has been disconnected.</p>
                <small>ERR_REMOTE_DISCONNECT</small>
                <button onclick="location.reload()">Reload</button>
            </div>
        </div>

        <div class="top-bar">
            <div>
            </div>
            <div>
            </div>
            <div>
                <button class="top-bar-btn"><i class="fa-solid fa-user"></i></button>
                <button class="top-bar-btn"><i class="fa-solid fa-bell"></i></button>
                <button class="top-bar-btn" id="top-bar-wifi-audio-btn"><i class="fa-solid fa-volume-high spacer-right"></i><i class="fa-solid fa-wifi"></i></button>
                <button class="time-btn top-bar-btn" id="top-bar-time">AT:XX</button>
            </div>
        </div>
        <div class="top-bar-popups">
            <div class="wifi-speaker-popup display-none">
                <p>Wifi connection</p>
                <div class="long-btn-wrapper">
                    <div>
                        <i class="fa-solid fa-wifi powered-on"></i> fabi-sc.de
                    </div>
                    <button class="right-btn disconnect display-none" id="wifi-disconnect"><i class="fa-solid fa-link-slash"></i> Disconnect</button>
                    <button class="right-btn menu" id="wifi-extended-menu"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
                <hr>
                <p>Volume <span id="volume-display">0%</span></p>
                <input class="slider headphone" id="volume-slider" type="range" min="0" max="100" value="0" />
            </div>
        </div>

        <div class="workspace">
        </div>

        <div class="taskbar">
            <button class=""></button>
        </div>

        <script type="module">
            const dev_mode = true;
            const timestamp = dev_mode ? Math.floor(Date.now() / 1000) : 0;

            import(`/resources/script/fabi_sc_code.js?dev_stamp=${timestamp}`)
            .then(module => {
                return module.default(`/resources/script/fabi_sc_code_bg.wasm?dev_stamp=${timestamp}`);
            })
            .catch(error => console.error("WASM init failed:", error));
        </script>
    </body>
</html>
