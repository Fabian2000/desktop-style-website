[package]
name = "fabi-sc-code"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-events = "0.2"
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Python Runtime
rustpython-vm = { version = "0.4", default-features = false, features = ["compiler"] }
rustpython-compiler = "0.4"
rustpython-parser = "0.4"

# WASM random support
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3.77", features = [
  "Window", "Document", "Element", "Node", "Event", "EventTarget",
  "HtmlElement", "HtmlInputElement", "HtmlCanvasElement", "HtmlCollection",
  "HtmlImageElement", "CssStyleDeclaration",
  "CanvasRenderingContext2d", "MouseEvent", "KeyboardEvent", "Performance",
  "console", "DomTokenList",
  "IdbDatabase", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
  "IdbObjectStore", "IdbTransactionMode", "DomException", "IdbVersionChangeEvent",
  "MediaQueryList", "Touch", "TouchEvent", "TouchList", "AddEventListenerOptions",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "NodeList",
  "BroadcastChannel", "MessageEvent"
] }
base64 = "0.22.1"
sanitize-filename = "0.6.0"
sha2 = { version = "0.10.9", features = ["asm"] }
hmac = "0.12.1"
md-5 = "0.10.6"
sha1 = "0.10.6"
aes = { version = "0.8.4", default-features = false }
cbc = { version = "0.1.2", default-features = false, features = ["alloc", "block-padding"] }
csv = "1.4.0"
zip = { version = "6.0.0", features = ["deflate"] }
rand = { version = "0.9.2", features = ["std_rng"] }
regex = "1.11"

[build-dependencies]
chrono = "0.4.41"
