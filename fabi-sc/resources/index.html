<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fabian's Desktop</title>
        <link rel="icon" type="image/png" href="/resources/img/logo_inverted_bg.webp">
        <link rel="stylesheet" href="/resources/styles/main.css">
        <link rel="stylesheet" href="/resources/extern/fontawesome-free-7.0.0-web/css/all.min.css">
        <noscript>
            <style>
                .boot-animation {
                    display: none;
                }
            </style>
        </noscript>
    </head>
    <body>
        <!-- Yew renders here -->
        <div id="app"></div>

        <!-- Static boot screen - shown immediately before WASM loads -->
        <div class="boot-screen" id="static-boot-screen" oncontextmenu="return false">
            <div class="boot-identifier">
                <div class="boot-logo"></div>
            </div>
            <div class="boot-animation">
                <div class="boot-spinner"></div>
            </div>
            <noscript>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [ERR] Boot progress canceled.</p>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [INF] Unable to load scripts</p>
            </noscript>
        </div>

        <script type="module">
            const dev_mode = true;
            const timestamp = dev_mode ? Math.floor(Date.now() / 1000) : 0;

            // Boot screen will be hidden after WASM loads + 3 seconds
            window.__bootComplete = false;

            // ================================================================
            // App State Storage - Persists Python app state between runs
            // ================================================================
            window.__appState = {
                _states: new Map(),

                get(windowId, key) {
                    const state = this._states.get(windowId);
                    return state ? state[key] : undefined;
                },

                set(windowId, key, value) {
                    if (!this._states.has(windowId)) {
                        this._states.set(windowId, {});
                    }
                    this._states.get(windowId)[key] = value;
                },

                getAll(windowId) {
                    return this._states.get(windowId) || {};
                },

                clear(windowId) {
                    this._states.delete(windowId);
                }
            };

            // ================================================================
            // VFS Sync Bridge - Provides synchronous VFS access for Python
            // Uses an in-memory cache that syncs with IndexedDB
            // ================================================================
            window.__vfsSync = {
                // In-memory cache: path -> { type: 'file'|'dir', content?: string, children?: Map }
                _cache: new Map(),
                _db: null,
                _initialized: false,

                // Initialize from IndexedDB
                async init() {
                    if (this._initialized) return;

                    try {
                        this._db = await new Promise((resolve, reject) => {
                            const request = indexedDB.open('fabiscos_vfs', 1);
                            request.onerror = () => reject(request.error);
                            request.onsuccess = () => resolve(request.result);
                            request.onupgradeneeded = (e) => {
                                const db = e.target.result;
                                if (!db.objectStoreNames.contains('nodes')) {
                                    db.createObjectStore('nodes', { keyPath: 'path' });
                                }
                                if (!db.objectStoreNames.contains('content')) {
                                    db.createObjectStore('content', { keyPath: 'path' });
                                }
                            };
                        });

                        await this._loadCache();
                        this._initialized = true;
                    } catch (e) {
                        console.error('[VFS Sync] Init failed:', e);
                    }
                },

                // Load all nodes from IndexedDB into cache
                async _loadCache() {
                    if (!this._db) return;

                    const tx = this._db.transaction(['nodes', 'content'], 'readonly');
                    const nodes = await new Promise((resolve, reject) => {
                        const request = tx.objectStore('nodes').getAll();
                        request.onsuccess = () => resolve(request.result || []);
                        request.onerror = () => reject(request.error);
                    });

                    this._cache.clear();
                    for (const node of nodes) {
                        this._cache.set(node.path, {
                            type: node.file_type === 'Directory' ? 'directory' : 'file',
                            name: node.name,
                            permissions: node.permissions
                        });
                    }

                    console.log('[VFS Sync] Loaded', nodes.length, 'nodes into cache');
                },

                // Refresh cache from IndexedDB (called after Rust VFS init)
                async refresh() {
                    console.log('[VFS Sync] Refreshing cache from IndexedDB...');
                    await this._loadCache();
                },

                // Synchronous read - returns cached content or fetches on demand
                readText(path) {
                    const entry = this._cache.get(path);
                    if (!entry || entry.type !== 'file') return null;
                    if (entry.content !== undefined) return entry.content;

                    // Try to load content synchronously (will fail if not cached)
                    // For system files, we load them during boot
                    return null;
                },

                exists(path) {
                    return this._cache.has(path);
                },

                listDir(path) {
                    // Find all direct children of path
                    const prefix = path.endsWith('/') ? path : path + '/';
                    const results = [];

                    for (const [entryPath, entry] of this._cache) {
                        if (entryPath.startsWith(prefix)) {
                            const remaining = entryPath.slice(prefix.length);
                            // Only direct children (no further slashes)
                            if (remaining && !remaining.includes('/')) {
                                results.push({
                                    name: entry.name || remaining,
                                    type: entry.type
                                });
                            }
                        }
                    }

                    return results;
                },

                write(path, content) {
                    this._cache.set(path, {
                        type: 'file',
                        name: path.split('/').pop(),
                        content: content
                    });
                    // Async persist to IndexedDB
                    this._persistNode(path, 'File', content);
                    return true;
                },

                mkdir(path) {
                    if (this._cache.has(path)) return false;
                    this._cache.set(path, {
                        type: 'directory',
                        name: path.split('/').pop()
                    });
                    this._persistNode(path, 'Directory', null);
                    return true;
                },

                remove(path) {
                    if (!this._cache.has(path)) return false;
                    this._cache.delete(path);
                    this._deleteNode(path);
                    return true;
                },

                copy(src, dst) {
                    const entry = this._cache.get(src);
                    if (!entry || entry.type !== 'file') return false;
                    this._cache.set(dst, { ...entry, name: dst.split('/').pop() });
                    this._persistNode(dst, 'File', entry.content);
                    return true;
                },

                move(src, dst) {
                    if (!this.copy(src, dst)) return false;
                    return this.remove(src);
                },

                // Async helpers for IndexedDB persistence
                async _persistNode(path, fileType, content) {
                    if (!this._db) return;
                    const tx = this._db.transaction(['nodes', 'content'], 'readwrite');
                    tx.objectStore('nodes').put({
                        path: path,
                        name: path.split('/').pop(),
                        file_type: fileType,
                        permissions: { readonly: false, system: false, hidden: false },
                        created: Date.now(),
                        modified: Date.now(),
                        size: content ? content.length : 0
                    });
                    if (content !== null) {
                        tx.objectStore('content').put({ path: path, data: content });
                    }
                },

                async _deleteNode(path) {
                    if (!this._db) return;
                    const tx = this._db.transaction(['nodes', 'content'], 'readwrite');
                    tx.objectStore('nodes').delete(path);
                    tx.objectStore('content').delete(path);
                },

                // Load file content from IndexedDB into cache
                async loadContent(path) {
                    if (!this._db) return null;
                    const tx = this._db.transaction('content', 'readonly');
                    const result = await new Promise((resolve) => {
                        const request = tx.objectStore('content').get(path);
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => resolve(null);
                    });
                    if (result && result.data) {
                        const entry = this._cache.get(path);
                        if (entry) {
                            // Convert Uint8Array to string if needed
                            if (result.data instanceof Uint8Array) {
                                entry.content = new TextDecoder().decode(result.data);
                            } else {
                                entry.content = result.data;
                            }
                        }
                        return entry?.content;
                    }
                    return null;
                }
            };

            // Initialize VFS sync cache before loading WASM
            window.__vfsSync.init().then(() => {
                import(`/resources/script/fabi_sc_code.js?dev_stamp=${timestamp}`)
                .then(module => {
                    return module.default(`/resources/script/fabi_sc_code_bg.wasm?dev_stamp=${timestamp}`);
                })
                .then(() => {
                    // WASM loaded, wait 3 more seconds then signal boot complete
                    setTimeout(() => {
                        window.__bootComplete = true;
                        document.getElementById('static-boot-screen')?.classList.add('display-none');
                    }, 3000);
                })
                .catch(error => console.error("WASM init failed:", error));
            });
        </script>
    </body>
</html>
