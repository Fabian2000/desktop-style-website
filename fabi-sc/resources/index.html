<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fabian's Desktop</title>
        <link rel="icon" type="image/png" href="/resources/img/logo_inverted_bg.webp">
        <link rel="stylesheet" href="/resources/styles/main.css">
        <link rel="stylesheet" href="/resources/extern/fontawesome-free-7.0.0-web/css/all.min.css">
        <noscript>
            <style>
                .boot-animation {
                    display: none;
                }
            </style>
        </noscript>
    </head>
    <body>
        <!-- Yew renders here -->
        <div id="app"></div>

        <!-- Static boot screen - shown immediately before WASM loads -->
        <div class="boot-screen" id="static-boot-screen" oncontextmenu="return false">
            <div class="boot-identifier">
                <div class="boot-logo"></div>
            </div>
            <div class="boot-animation">
                <div class="boot-spinner"></div>
            </div>
            <noscript>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [ERR] Boot progress canceled.</p>
                <p style="font-size: 20pt; color: #ffffff;">&gt; [INF] Unable to load scripts</p>
            </noscript>
        </div>

        <script type="module">
            const dev_mode = true;
            const timestamp = dev_mode ? Math.floor(Date.now() / 1000) : 0;

            // Boot screen will be hidden after WASM loads + 3 seconds
            window.__bootComplete = false;

            // ================================================================
            // App State Storage - Persists Python app state between runs
            // ================================================================
            window.__appState = {
                _states: new Map(),

                get(windowId, key) {
                    const state = this._states.get(windowId);
                    return state ? state[key] : undefined;
                },

                set(windowId, key, value) {
                    if (!this._states.has(windowId)) {
                        this._states.set(windowId, {});
                    }
                    this._states.get(windowId)[key] = value;
                },

                getAll(windowId) {
                    return this._states.get(windowId) || {};
                },

                clear(windowId) {
                    this._states.delete(windowId);
                }
            };

            // ================================================================
            // HTTP API - Synchronous HTTP requests for Python apps
            // Uses XMLHttpRequest in sync mode (deprecated but functional)
            // ================================================================
            window.__http = {
                /**
                 * Perform a synchronous HTTP request
                 * @param {string} url - The URL to fetch
                 * @param {string} method - HTTP method (GET, POST, PUT, DELETE, etc.)
                 * @param {string|null} body - Request body (for POST/PUT)
                 * @param {string} headersJson - JSON string of headers object
                 * @returns {object} - {status, ok, text, error?}
                 */
                fetchSync(url, method, body, headersJson) {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open(method, url, false); // false = synchronous

                        // Parse and set headers
                        try {
                            const headers = JSON.parse(headersJson || '{}');
                            for (const [key, value] of Object.entries(headers)) {
                                xhr.setRequestHeader(key, value);
                            }
                        } catch (e) {
                            // Invalid headers JSON, ignore
                        }

                        // Set default content-type for POST/PUT if not specified
                        if ((method === 'POST' || method === 'PUT') && body && !headersJson?.includes('Content-Type')) {
                            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                        }

                        // Send request
                        xhr.send(body || null);

                        return {
                            status: xhr.status,
                            ok: xhr.status >= 200 && xhr.status < 300,
                            text: xhr.responseText
                        };
                    } catch (e) {
                        return {
                            status: 0,
                            ok: false,
                            text: '',
                            error: e.message || 'Network error'
                        };
                    }
                }
            };

            // Load WASM module
            import(`/resources/script/fabi_sc_code.js?dev_stamp=${timestamp}`)
            .then(module => {
                return module.default(`/resources/script/fabi_sc_code_bg.wasm?dev_stamp=${timestamp}`);
            })
            .then(() => {
                // WASM loaded, wait 3 more seconds then signal boot complete
                setTimeout(() => {
                    window.__bootComplete = true;
                    document.getElementById('static-boot-screen')?.classList.add('display-none');
                }, 3000);
            })
            .catch(error => console.error("WASM init failed:", error));
        </script>
    </body>
</html>
